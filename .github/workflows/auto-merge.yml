name: Auto Merge PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]
  workflow_run:
    # Must match the `name:` of auto_approve_prs.yml exactly, otherwise the
    # trigger silently never fires.
    workflows: ["Auto Approve PRs"]
    types: [completed]

permissions:
  pull-requests: write
  contents: write

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' && (
        github.event.pull_request.user.login == 'github-actions' ||
        github.event.pull_request.user.login == 'github-actions[bot]' ||
        github.event.pull_request.user.login == 'appodeal-runner' ||
        github.event.pull_request.user.login == 'appodeal-bot' ||
        startsWith(github.event.pull_request.head.ref, 'release/') ||
        startsWith(github.event.pull_request.head.ref, 'bot/')
      )
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          echo "📋 Enabling auto-merge for PR: $PR_URL"
          echo "👤 Created by: ${{ github.event.pull_request.user.login }}"
          echo "🌿 Branch: ${{ github.event.pull_request.head.ref }}"

          gh pr merge "$PR_URL" --auto --squash --delete-branch

          echo "✅ Auto-merge enabled for PR: $PR_URL"

  merge-approved:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request_review' && github.event.review.state == 'approved') ||
      (github.event_name == 'check_suite' && github.event.check_suite.conclusion == 'success') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Try to merge approved PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Resolve the PR this event belongs to
          if [ "${{ github.event_name }}" = "pull_request_review" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          elif [ "${{ github.event_name }}" = "check_suite" ]; then
            PR_NUMBER="${{ github.event.check_suite.pull_requests[0].number }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            PR_NUMBER=$(gh api "/repos/${{ github.repository }}/pulls" \
              --jq '.[] | select(.head.sha == "${{ github.event.workflow_run.head_sha }}") | .number' | head -1)
          fi

          if [ -z "${PR_NUMBER:-}" ] || [ "${PR_NUMBER}" = "null" ]; then
            echo "No PR associated with this event"
            exit 0
          fi

          PR_URL="https://github.com/${{ github.repository }}/pull/${PR_NUMBER}"
          PR_DATA=$(gh pr view "${PR_NUMBER}" --json author,headRefName,state)
          PR_USER=$(echo "$PR_DATA" | jq -r '.author.login')
          PR_BRANCH=$(echo "$PR_DATA" | jq -r '.headRefName')
          PR_STATE=$(echo "$PR_DATA" | jq -r '.state')

          echo "📋 Checking PR: $PR_URL"
          echo "👤 Created by: $PR_USER"
          echo "🌿 Branch: $PR_BRANCH"

          # Same trust list as the enable-auto-merge job above
          if [[ "$PR_USER" != "github-actions" &&
                "$PR_USER" != "github-actions[bot]" &&
                "$PR_USER" != "appodeal-runner" &&
                "$PR_USER" != "appodeal-bot" &&
                ! "$PR_BRANCH" =~ ^release/ &&
                ! "$PR_BRANCH" =~ ^bot/ ]]; then
            echo "❌ PR is not from a trusted source"
            exit 0
          fi

          if [ "$PR_STATE" = "MERGED" ] || [ "$PR_STATE" = "CLOSED" ]; then
            echo "PR is already $PR_STATE"
            exit 0
          fi

          APPROVED=$(gh pr view "$PR_URL" --json reviews --jq '[.reviews[] | select(.state == "APPROVED")] | length > 0')
          if [ "$APPROVED" != "true" ]; then
            echo "⏳ PR is not approved yet"
            exit 0
          fi

          CHECKS_PASSED=$(gh pr checks "$PR_URL" --json state --jq 'all(.state == "SUCCESS" or .state == "SKIPPED")' 2>/dev/null || echo "true")
          if [ "$CHECKS_PASSED" != "true" ]; then
            echo "⏳ Some checks are still pending or failed — arming auto-merge instead"
            gh pr merge "$PR_URL" --auto --squash --delete-branch || true
            exit 0
          fi

          echo "✅ All conditions met, merging PR now"
          gh pr merge "$PR_URL" --squash --delete-branch
